name: Train tattoo price model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ml/train.py"
      - "ml/data/tattoo_price_model_ready_v4.csv"
      - ".github/workflows/train-tattoo-model.yml"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas numpy scikit-learn joblib

      - name: Train model and capture metrics
        run: |
          mkdir -p ml/training_outputs
          python ml/train.py | tee ml/training_outputs/training_metrics.txt

      - name: Upload trained model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: tattoo-price-model
          path: |
            ml/saved_models/price_prediction_model.joblib
            ml/training_outputs/training_metrics.txt
          if-no-files-found: error
