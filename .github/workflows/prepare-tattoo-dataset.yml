name: Prepare tattoo ML dataset

on:
  push:
    branches: [main]
    paths:
      - "ml/data/tattoo_price_dataset_v3.csv"
      - "ml/preprocessing/prepare_dataset.py"
      - ".github/workflows/prepare-tattoo-dataset.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas numpy

      - name: Generate v4 model-ready dataset
        run: python ml/preprocessing/prepare_dataset.py

      - name: Commit v4 dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/data/tattoo_price_model_ready_v4.csv
          if git diff --cached --quiet; then
            echo "No dataset changes."
          else
            git commit -m "Generate v4 model-ready tattoo dataset"
            git push
          fi
